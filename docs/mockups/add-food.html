<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add food · Formkoll mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#7CC4FF}a:hover{color:#A9D8FF}
</style>
<style>html{background:#0E1218}body{display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E1218; color: #EEF2F7; font-family: Inter, system-ui, sans-serif; box-sizing: border-box">
<main style="padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<header style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #A3AEBF">Wed 20 Jan · 82 g protein left</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 24px; font-weight: 700">Add to afternoon</h1>
</div>
<a href="food.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2B3442; background: #171C25; color: #EEF2F7; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</header>

<div style="display: flex; gap: 8px">
<label style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid #2B3442; background: #171C25; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3AEBF" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg>
<input aria-label="Search foods" placeholder="Search foods" style="flex: 1; min-width: 0; border: none; background: transparent; color: #EEF2F7; font-family: Inter, system-ui, sans-serif; font-size: 15px; outline: none">
</label>
<button aria-label="Scan barcode" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid #2B3442; background: #171C25; color: #EEF2F7; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M17 9v6"></path></svg></button>
</div>

<div role="tablist" aria-label="Sources" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #171C25; border-radius: 12px; padding: 4px">
<button role="tab" aria-selected="true" style="min-height: 40px; border-radius: 9px; border: none; background: #2B3442; color: #EEF2F7; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600">Templates</button>
<button role="tab" aria-selected="false" style="min-height: 40px; border-radius: 9px; border: none; background: transparent; color: #A3AEBF; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 500">Recent</button>
<button role="tab" aria-selected="false" style="min-height: 40px; border-radius: 9px; border: none; background: transparent; color: #A3AEBF; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 500">Recipes</button>
</div>

<ul aria-label="Meal templates" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<li style="background: #171C25; border-radius: 16px; padding: 12px 10px 12px 14px; display: flex; align-items: center; gap: 12px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 15px; font-weight: 600">Pre-climb snack</span><span style="font-size: 12px; color: #A3AEBF">Banana + 250 g kvarg · 250 kcal · 28 g</span></span>
<button style="height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: #7CC4FF; color: #0E1218; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 14px">Add</button>
</li>
<li style="background: #171C25; border-radius: 16px; padding: 12px 10px 12px 14px; display: flex; align-items: center; gap: 12px">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 15px; font-weight: 600">Kvarg, granola, banana</span><span style="font-size: 12px; color: #A3AEBF">400 kcal · 30 g</span></span>
<button style="height: 44px; padding: 0 16px; border-radius: 12px; border: none; background: #1F2631; color: #EEF2F7; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 14px">Add</button>
</li>
</ul>

<section aria-labelledby="h-portion" style="background: #171C25; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="h-portion" style="margin: 0; font-size: 15px; font-weight: 600">Kvarg naturell</h2>
<span style="font-size: 12px; color: #A3AEBF">Per 100 g: 60 kcal · 11 g protein · 4.0 kr</span>
</div>
<span style="font-size: 11px; font-weight: 600; color: #CBD3DE; border: 1px solid #3A4556; border-radius: 8px; padding: 3px 7px">Livsmedelsverket</span>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<label style="display: flex; align-items: center; gap: 6px; height: 44px; border-radius: 10px; border: 1.5px solid #7CC4FF; background: #0E1218; padding: 0 12px; width: 110px; box-sizing: border-box">
<input aria-label="Grams" value="250" inputmode="numeric" style="width: 56px; border: none; background: transparent; color: #EEF2F7; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600; outline: none">
<span style="font-size: 14px; color: #A3AEBF">g</span>
</label>
<button style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #2B3442; background: transparent; color: #EEF2F7; font-family: Inter, system-ui, sans-serif; font-size: 13px">150 g</button>
<button style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #2B3442; background: transparent; color: #EEF2F7; font-family: Inter, system-ui, sans-serif; font-size: 13px">500 g</button>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600">150 kcal · 28 g <span style="font-size: 13px; color: #A3AEBF; font-weight: 500">· 10 kr</span></span>
<a href="food.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #7CC4FF; color: #0E1218; display: flex; align-items: center; text-decoration: none; font-weight: 600; font-size: 14px">Add</a>
</div>
</section>

<section aria-labelledby="h-quick" style="border: 1px dashed #3A4556; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<h2 id="h-quick" style="margin: 0; font-size: 15px; font-weight: 600">Quick entry <span style="font-size: 12px; color: #A3AEBF; font-weight: 400">when you only know the numbers</span></h2>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #A3AEBF">kcal<input inputmode="numeric" style="height: 44px; border-radius: 10px; border: 1px solid #2B3442; background: #0E1218; color: #EEF2F7; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; padding: 0 12px; min-width: 0"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #A3AEBF">Protein, g<input inputmode="numeric" style="height: 44px; border-radius: 10px; border: 1px solid #2B3442; background: #0E1218; color: #EEF2F7; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; padding: 0 12px; min-width: 0"></label>
<button style="height: 44px; padding: 0 16px; border-radius: 10px; border: none; background: #1F2631; color: #EEF2F7; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 14px">Add</button>
</div>
</section>
</main>
</div>
</body>
</html>
