<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gym logger · Formkoll mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#7CC4FF}a:hover{color:#A9D8FF}

<body>
<div style="width: 390px; height: 960px; position: relative; overflow: hidden; background: #0E1218; color: #EEF2F7; font-family: Inter, system-ui, sans-serif; box-sizing: border-box">
<main style="padding: 12px 20px 100px; display: flex; flex-direction: column; gap: 12px">
<header style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<a href="week.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; width: 96px; color: #7CC4FF; text-decoration: none; font-size: 15px; font-weight: 500"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>Week</a>
<a href="exercise-ai.html" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #2B3442; background: #171C25; color: #EEF2F7; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 14px; font-weight: 600; box-sizing: border-box"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-8l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"></path><path d="M12 8v5M9.5 10.5h5"></path></svg>Ask AI</a>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 26px; font-weight: 700">Gym A · strength</h1>
<span style="font-size: 13px; color: #A3AEBF">Tue 19 Jan · Fitness24Seven Hötorget</span>
</div>
<span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 600; color: #A3AEBF">24 min</span>
</div>
</header>

<section aria-labelledby="ex1" style="background: #171C25; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<h2 id="ex1" style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 600">Trap-bar deadlift</h2>
<span style="font-size: 13px; color: #A3AEBF">4 × 5</span>
</div>
<p style="margin: 0; background: #1F2631; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.4; display: flex; gap: 8px; align-items: flex-start"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7CC4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 19V5M6 11l6-6 6 6"></path></svg><span>All sets hit 5 last time (90 kg, 12 Jan). <strong style="font-weight: 600">Try 92.5 kg.</strong></span></p>
<div role="table" aria-label="Trap-bar deadlift sets" style="display: flex; flex-direction: column; gap: 6px">
<div role="row" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; font-size: 12px; color: #A3AEBF; padding: 0 4px">
<span role="columnheader">Set</span><span role="columnheader">kg</span><span role="columnheader">Reps</span><span role="columnheader" style="text-align: center">Done</span>
</div>
<div role="row" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; padding: 0 4px">
<span role="cell" style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; color: #A3AEBF">1</span>
<input role="cell" aria-label="Set 1 kg" value="92.5" inputmode="decimal" style="height: 44px; border-radius: 10px; border: 1px solid #2B3442; background: #0E1218; color: #EEF2F7; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600; padding: 0 12px; min-width: 0">
<input role="cell" aria-label="Set 1 reps" value="5" inputmode="numeric" style="height: 44px; border-radius: 10px; border: 1px solid #2B3442; background: #0E1218; color: #EEF2F7; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600; padding: 0 12px; min-width: 0">
<button role="cell" aria-label="Set 1 done" aria-pressed="true" style="width: 44px; height: 44px; justify-self: center; border-radius: 12px; border: none; background: #7CC4FF; color: #0E1218; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
</div>
<div role="row" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; padding: 0 4px">
<span role="cell" style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; color: #A3AEBF">2</span>
<input role="cell" aria-label="Set 2 kg" value="92.5" inputmode="decimal" style="height: 44px; border-radius: 10px; border: 1px solid #2B3442; background: #0E1218; color: #EEF2F7; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600; padding: 0 12px; min-width: 0">
<input role="cell" aria-label="Set 2 reps" value="5" inputmode="numeric" style="height: 44px; border-radius: 10px; border: 1px solid #2B3442; background: #0E1218; color: #EEF2F7; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600; padding: 0 12px; min-width: 0">
<button role="cell" aria-label="Set 2 done" aria-pressed="true" style="width: 44px; height: 44px; justify-self: center; border-radius: 12px; border: none; background: #7CC4FF; color: #0E1218; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
</div>
<div role="row" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; padding: 4px; background: #1F2631; border-radius: 12px">
<span role="cell" style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600">3</span>
<input role="cell" aria-label="Set 3 kg" value="92.5" inputmode="decimal" style="height: 44px; border-radius: 10px; border: 1.5px solid #7CC4FF; background: #0E1218; color: #EEF2F7; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600; padding: 0 12px; min-width: 0">
<input role="cell" aria-label="Set 3 reps" placeholder="5" inputmode="numeric" style="height: 44px; border-radius: 10px; border: 1.5px solid #7CC4FF; background: #0E1218; color: #EEF2F7; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600; padding: 0 12px; min-width: 0">
<button role="cell" aria-label="Set 3 done" aria-pressed="false" style="width: 44px; height: 44px; justify-self: center; border-radius: 12px; border: 1.5px solid #7CC4FF; background: transparent; color: #7CC4FF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
</div>
<div role="row" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; padding: 0 4px">
<span role="cell" style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600; color: #A3AEBF">4</span>
<input role="cell" aria-label="Set 4 kg" value="92.5" inputmode="decimal" style="height: 44px; border-radius: 10px; border: 1px solid #2B3442; background: #0E1218; color: #A3AEBF; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600; padding: 0 12px; min-width: 0">
<input role="cell" aria-label="Set 4 reps" placeholder="5" inputmode="numeric" style="height: 44px; border-radius: 10px; border: 1px solid #2B3442; background: #0E1218; color: #A3AEBF; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600; padding: 0 12px; min-width: 0">
<button role="cell" aria-label="Set 4 done" aria-pressed="false" style="width: 44px; height: 44px; justify-self: center; border-radius: 12px; border: 1px solid #2B3442; background: transparent; color: #A3AEBF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
</div>
</div>
</section>

<section aria-labelledby="ex2" style="background: #171C25; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<h2 id="ex2" style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; font-weight: 600">Bulgarian split squat</h2>
<span style="font-size: 13px; color: #A3AEBF">3 × 8 per leg</span>
</div>
<span style="font-size: 13px; color: #A3AEBF">Last: 2 × 16 kg · 8, 8, 7. Same weight until every set hits 8.</span>
</section>

<ul aria-label="Remaining exercises" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
<li style="display: flex"><button style="flex: 1; min-height: 48px; border-radius: 14px; border: 1px solid #2B3442; background: transparent; color: #EEF2F7; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500"><span>Dumbbell bench press</span><span style="font-size: 13px; color: #A3AEBF">3 × 8 · last 26 kg</span></button></li>
<li style="display: flex"><button style="flex: 1; min-height: 48px; border-radius: 14px; border: 1px solid #2B3442; background: transparent; color: #EEF2F7; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500"><span>Nordic hamstring curl</span><span style="font-size: 13px; color: #A3AEBF">3 × 4–6</span></button></li>
<li style="display: flex"><button style="flex: 1; min-height: 48px; border-radius: 14px; border: 1px solid #2B3442; background: transparent; color: #EEF2F7; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500"><span>Half-kneeling press</span><span style="font-size: 13px; color: #A3AEBF">3 × 8 · last 14 kg</span></button></li>
<li style="display: flex"><button style="flex: 1; min-height: 48px; border-radius: 14px; border: 1px solid #2B3442; background: transparent; color: #EEF2F7; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500"><span>Copenhagen plank</span><span style="font-size: 13px; color: #A3AEBF">3 × 20–30 s</span></button></li>
<li style="display: flex"><button style="flex: 1; min-height: 48px; border-radius: 14px; border: 1px solid #2B3442; background: transparent; color: #EEF2F7; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 500"><span>Calf raise, straight + bent</span><span style="font-size: 13px; color: #A3AEBF">2 × 12</span></button></li>
</ul>
</main>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: #12161E; border-top: 1px solid #2B3442; display: flex; align-items: center; gap: 10px; padding: 0 20px 8px; box-sizing: border-box">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #A3AEBF">Rest</span><span style="font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 600">1:42 / 3:00</span></span>
<span aria-hidden="true" style="height: 6px; border-radius: 3px; background: #263040; display: flex"><span style="width: 43%; border-radius: 3px; background: #7CC4FF"></span></span>
</div>
<button style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #2B3442; background: transparent; color: #EEF2F7; font-family: Inter, system-ui, sans-serif; font-weight: 500; font-size: 14px">Skip rest</button>
<button style="height: 48px; padding: 0 16px; border-radius: 14px; border: none; background: #7CC4FF; color: #0E1218; font-family: Inter, system-ui, sans-serif; font-weight: 600; font-size: 14px">Finish</button>
</div>
</div>
