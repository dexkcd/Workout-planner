<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping list · Formkoll mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#7CC4FF}a:hover{color:#A9D8FF}
</style>
<style>html{background:#0E1218}body{display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 390px; height: 960px; position: relative; overflow: hidden; background: #0E1218; color: #EEF2F7; font-family: Inter, system-ui, sans-serif; box-sizing: border-box">
<main style="padding: 16px 20px 96px; display: flex; flex-direction: column; gap: 14px">
<header style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #A3AEBF; font-weight: 500">For week 11 · 18–24 Jan</span>
<h1 style="margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 30px; font-weight: 700">Shop</h1>
</header>

<nav aria-label="Shop sections" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #171C25; border-radius: 12px; padding: 4px">
<a href="shop.html" aria-current="page" style="min-height: 40px; border-radius: 9px; background: #2B3442; color: #EEF2F7; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 600">List</a>
<a href="receipt.html" style="min-height: 40px; border-radius: 9px; color: #A3AEBF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 500">Receipts</a>
<a href="costs.html" style="min-height: 40px; border-radius: 9px; color: #A3AEBF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 500">Costs</a>
</nav>

<div aria-label="Planned recipes" style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="height: 36px; padding: 0 12px; border-radius: 18px; background: #1F2631; display: flex; align-items: center; font-size: 13px; font-weight: 500">Chili × 8</span>
<span style="height: 36px; padding: 0 12px; border-radius: 18px; background: #1F2631; display: flex; align-items: center; font-size: 13px; font-weight: 500">Chicken tray bake × 6</span>
<button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px dashed #3A4556; background: transparent; color: #7CC4FF; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600">Add recipe</button>
</div>

<section aria-labelledby="g1" style="display: flex; flex-direction: column; gap: 0">
<h2 id="g1" style="margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #A3AEBF; text-transform: uppercase; letter-spacing: 0.08em">Meat and fish</h2>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1; color: #A3AEBF; text-decoration: line-through">Nötfärs 10%</span><span style="font-size: 13px; color: #A3AEBF">1 kg</span></label>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1; color: #A3AEBF; text-decoration: line-through">Kycklinglårfilé</span><span style="font-size: 13px; color: #A3AEBF">1.5 kg</span></label>
</section>

<section aria-labelledby="g2" style="display: flex; flex-direction: column; gap: 0">
<h2 id="g2" style="margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #A3AEBF; text-transform: uppercase; letter-spacing: 0.08em">Dairy</h2>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1; color: #A3AEBF; text-decoration: line-through">Kvarg naturell</span><span style="font-size: 13px; color: #A3AEBF">2 × 1 kg</span></label>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1">Keso</span><span style="font-size: 13px; color: #A3AEBF">2 × 500 g</span></label>
</section>

<section aria-labelledby="g3" style="display: flex; flex-direction: column; gap: 0">
<h2 id="g3" style="margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #A3AEBF; text-transform: uppercase; letter-spacing: 0.08em">Fruit and veg</h2>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1; color: #A3AEBF; text-decoration: line-through">Bananas</span><span style="font-size: 13px; color: #A3AEBF">~1.2 kg</span></label>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1">Potatoes</span><span style="font-size: 13px; color: #A3AEBF">2 kg</span></label>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1">Carrots and onions</span><span style="font-size: 13px; color: #A3AEBF">1 kg each</span></label>
</section>

<section aria-labelledby="g4" style="display: flex; flex-direction: column; gap: 0">
<h2 id="g4" style="margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #A3AEBF; text-transform: uppercase; letter-spacing: 0.08em">Pantry</h2>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1; color: #A3AEBF; text-decoration: line-through">Red lentils</span><span style="font-size: 13px; color: #A3AEBF">500 g</span></label>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1; color: #A3AEBF; text-decoration: line-through">Krossade tomater</span><span style="font-size: 13px; color: #A3AEBF">3 × 400 g</span></label>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1">Kidney beans</span><span style="font-size: 13px; color: #A3AEBF">2 cans</span></label>
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1F2631"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #7CC4FF"><span style="flex: 1; color: #A3AEBF; text-decoration: line-through">Basmati rice</span><span style="font-size: 13px; color: #A3AEBF">2 kg</span></label>
</section>

<div style="display: flex; align-items: center; gap: 12px">
<span style="flex: 1; font-size: 13px; color: #A3AEBF">About 640 kr at your last prices</span>
<a href="receipt.html" style="height: 48px; padding: 0 18px; border-radius: 14px; background: #7CC4FF; color: #0E1218; display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 15px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3.5L8 5.5h8L17.5 8H21v11H3z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Scan receipt</a>
</div>
</main>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #12161E; border-top: 1px solid #2B3442; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; box-sizing: border-box">
<a href="today.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; min-height: 48px; text-decoration: none; color: #A3AEBF; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z"></path></svg>Today</a>
<a href="week.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; min-height: 48px; text-decoration: none; color: #A3AEBF; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Week</a>
<a href="food.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; min-height: 48px; text-decoration: none; color: #A3AEBF; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0z"></path><path d="M9 8.5c0-1.6 1.5-1.9 1.5-3.5M14 8.5c0-1.6 1.5-1.9 1.5-3.5"></path></svg>Food</a>
<a href="body.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; min-height: 48px; text-decoration: none; color: #A3AEBF; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"></path></svg>Body</a>
<a href="shop.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; min-height: 48px; text-decoration: none; color: #7CC4FF; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8.5h14l-1.2 11.5H6.2z"></path><path d="M9 8.5V7a3 3 0 0 1 6 0v1.5"></path></svg>Shop</a>
</nav>
</div>
</body>
</html>
